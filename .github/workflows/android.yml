name: Android
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore alpha debug signing key
        id: signing-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: nearchess-alpha-signing-v1
      - name: Prepare alpha signing identity
        env:
          ALPHA_KEYSTORE_BASE64: ${{ secrets.ALPHA_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$ALPHA_KEYSTORE_BASE64" ]; then
            printf '%s' "$ALPHA_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          elif [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname 'CN=NearChess Alpha,O=NearChess,C=US' -keyalg RSA -keysize 2048 -validity 10000
            echo '::warning::New ALPHA key generated. Existing installs signed with another key cannot update in place. Cache is temporary; configure ALPHA_KEYSTORE_BASE64 for durable alpha signing.'
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey > "$RUNNER_TEMP/alpha-certificate.txt"
      - name: Persist alpha key for subsequent main builds
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.signing-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: nearchess-alpha-signing-v1
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle testDebugUnitTest assembleDebug --stacktrace
      - name: Package versioned APK and public signing fingerprint
        shell: bash
        run: |
          mkdir -p dist
          VERSION=$(python3 -c 'import json; print(json.load(open("app/build/outputs/apk/debug/output-metadata.json"))["elements"][0]["versionName"])')
          NAME="NearChess-${VERSION}-${GITHUB_SHA:0:7}-debug"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${NAME}.apk"
          cp app/build/outputs/apk/debug/output-metadata.json dist/output-metadata.json
          cp "$RUNNER_TEMP/alpha-certificate.txt" dist/SIGNING-CERTIFICATE.txt
          printf 'Commit: %s\nRun: %s\nChannel: alpha / debug\n' "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" > dist/BUILD.txt
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          echo "### ${NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Alpha update: compare SIGNING-CERTIFICATE.txt with your previous build. No production signing key is included.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ github.run_number }}
          path: app/build/reports/tests/
      - uses: actions/upload-artifact@v4
        with:
          name: NearChess-alpha-${{ github.run_number }}-debug
          path: dist/
          if-no-files-found: error
